# Low-precedence defaults; any service's application.yml overrides them.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
# Shared secret that proves identity headers came from the gateway or a trusted service (SEC-11).
# Unset = no verification (developer machines only; a warning is logged).
eternax.security.internal-secret=${INTERNAL_AUTH_SECRET:}
# Service migrations (V1, V2, ...) and the platform's own (V900+) are independent sets. A service that
# adds V2 after its database already holds V900/V901 must still be able to apply it.
spring.flyway.out-of-order=true
